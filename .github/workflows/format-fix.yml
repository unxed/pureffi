name: Temporary Format Fix
on:
  push:
    branches: [codex/coverage-batch2]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/coverage-batch2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: gofmt -w coverage_batch2_test.go
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage_batch2_test.go
          git diff --cached --quiet || git commit -m 'Format pureffi coverage batch 2'
          git push origin HEAD:codex/coverage-batch2