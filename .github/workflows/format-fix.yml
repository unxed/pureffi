name: Temporary Format Fix
on:
  push:
    branches: [codex/coverage-batch1]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/coverage-batch1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format test files
        run: gofmt -w coverage_batch1_test.go internal/strings/strings_test.go internal/xreflect/reflect_test.go
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage_batch1_test.go internal/strings/strings_test.go internal/xreflect/reflect_test.go
          git diff --cached --quiet || git commit -m 'Format pureffi coverage tests'
          git push origin HEAD:codex/coverage-batch1